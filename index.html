<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>灵台 · 观己</title>
  <meta name="description" content="花几分钟，整理一下最近的自己。灵台 · 观己只在当前浏览器中保存自我观察记录。">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main id="app" class="app-shell">
    <section id="welcome-view" class="welcome-view" aria-labelledby="welcome-title">
      <div class="welcome-mark" aria-hidden="true">观</div>
      <p class="eyebrow">灵台 · 观己</p>
      <h1 id="welcome-title">花几分钟，整理一下最近的自己。</h1>
      <p class="welcome-lead">没有标准答案，只是把最近的身体与生活线索放在一起看看。</p>
      <button id="start-button" class="button button-primary button-large" type="button">开始观己</button>
      <p class="privacy-note">填写内容仅保存在当前浏览器中。<br>本工具用于自我观察与资料整理，不用于疾病诊断。</p>
    </section>

    <section id="question-view" class="question-view" hidden aria-live="polite">
      <div class="question-topbar">
        <button id="question-home" class="icon-button" type="button" aria-label="返回欢迎页">灵台 · 观己</button>
        <span id="progress-label" class="progress-label">1 / 12</span>
      </div>
      <div class="progress-track" aria-hidden="true"><div id="progress-bar" class="progress-bar"></div></div>
      <div id="question-stage" class="question-stage"></div>
      <div class="question-actions">
        <button id="previous-button" class="button button-secondary" type="button">← 上一题</button>
        <button id="next-button" class="button button-primary" type="button">下一题 →</button>
      </div>
      <p class="flow-note">可以随时返回修改。所有问题都可以留空。</p>
    </section>

    <section id="report-view" class="report-view" hidden aria-live="polite">
      <div class="report-actions">
        <button id="report-edit" class="button button-secondary" type="button">← 返回修改</button>
        <button id="save-png" class="button button-primary" type="button">保存观己报告 PNG</button>
      </div>
      <div id="report-status" class="report-status" role="status"></div>
      <div id="report-box" class="report-box"></div>
    </section>
  </main>

  <footer class="site-footer">灵台 · 观己　|　只在此浏览器中保存</footer>

  <script src="./vendor/qrcode.js"></script>
  <script src="./vendor/html2canvas.min.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/matrix.js"></script>
  <script src="./js/timeline.js"></script>
  <script src="./js/story.js"></script>
  <script src="./js/report.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
